# Posts each SaveLogic release to https://modrinth.com/mod/savelogic.
#
# Runs when a GitHub release tagged v<mod version>+<Minecraft version> (e.g. v2.0.0-beta.9+26.3) is published,
# or by hand from the Actions tab for an existing tag. It uploads the release's jar with the Minecraft version taken
# from the tag, Fabric as the loader, Fabric API as a required dependency, the release notes as the changelog, and
# "beta" for GitHub pre-releases. A version already on Modrinth isn't uploaded again; its changelog is updated to
# match the release notes instead, so re-running after editing the notes syncs them.
#
# Needs a repository secret MODRINTH_TOKEN: a Modrinth personal access token with the "Read projects", "Read versions", "Create versions" and "Write versions" scopes.
name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v2.0.0-beta.8+26.3"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Upload the release jar to Modrinth
        env:
          GH_TOKEN: ${{ github.token }}
          # MODRITH_TOKEN (sic) is also accepted, matching the secret as it was first created.
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN || secrets.MODRITH_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
          UA: zinngar/Savelogic/release-workflow (github.com/zinngar/Savelogic)
          PROJECT: savelogic
          FABRIC_API: P7dR8mSH
        run: |
          set -euo pipefail
          case "$TAG" in
            v*+*) ;;
            *) echo "Release $TAG isn't tagged v<version>+<Minecraft version>; nothing to publish."; exit 0 ;;
          esac
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Add a MODRINTH_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          VERSION="${TAG#v}"
          MINECRAFT="${TAG##*+}"

          # Authenticated, so this also works while the project is still under review (not public yet).
          PROJECT_ID=$(curl -fsS -A "$UA" -H "Authorization: $MODRINTH_TOKEN" "https://api.modrinth.com/v2/project/$PROJECT" | jq -r .id) || {
            echo "::error::Couldn't read the Modrinth project. Check that the token is valid and has the 'Read projects' scope."
            exit 1
          }
          VERSIONS=$(curl -fsS -A "$UA" -H "Authorization: $MODRINTH_TOKEN" "https://api.modrinth.com/v2/project/$PROJECT_ID/version") || {
            echo "::error::Couldn't list the project's versions. Give the Modrinth token the 'Read versions' scope."
            exit 1
          }
          EXISTING=$(echo "$VERSIONS" | jq -r --arg v "$VERSION" 'first(.[] | select(.version_number == $v)) | .id // empty')
          if [ -n "$EXISTING" ]; then
            gh release view "$TAG" -R "$REPO" --json body | jq '{changelog: .body}' > changelog.json
            if [ "$(echo "$VERSIONS" | jq -r --arg id "$EXISTING" '.[] | select(.id == $id) | .changelog')" = "$(jq -r .changelog changelog.json)" ]; then
              echo "$VERSION is already on Modrinth with the same changelog."
              exit 0
            fi
            STATUS=$(curl -sS -o response.json -w '%{http_code}' -X PATCH "https://api.modrinth.com/v2/version/$EXISTING" \
              -A "$UA" -H "Authorization: $MODRINTH_TOKEN" -H "Content-Type: application/json" --data @changelog.json)
            if [ "$STATUS" != "204" ]; then
              cat response.json
              echo "::error::Couldn't update the changelog (HTTP $STATUS). Give the Modrinth token the 'Write versions' scope."
              exit 1
            fi
            echo "$VERSION is already on Modrinth; updated its changelog to match the release notes."
            exit 0
          fi

          gh release download "$TAG" -R "$REPO" -p "savelogic-*.jar" -D dist
          JAR=$(ls dist/savelogic-*.jar | grep -v -- '-sources' | head -n 1)
          gh release view "$TAG" -R "$REPO" --json name,body,isPrerelease > release.json

          jq -n --slurpfile r release.json --arg project "$PROJECT_ID" --arg version "$VERSION" \
                --arg minecraft "$MINECRAFT" --arg fabricApi "$FABRIC_API" '{
              project_id: $project,
              name: $r[0].name,
              version_number: $version,
              changelog: $r[0].body,
              version_type: (if $r[0].isPrerelease or ($version | test("beta|alpha")) then "beta" else "release" end),
              game_versions: [$minecraft],
              loaders: ["fabric"],
              dependencies: [{project_id: $fabricApi, dependency_type: "required"}],
              featured: true,
              file_parts: ["file"],
              primary_file: "file"
            }' > data.json
          cat data.json | jq 'del(.changelog)'

          STATUS=$(curl -sS -o response.json -w '%{http_code}' -X POST "https://api.modrinth.com/v2/version" \
            -A "$UA" -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=@data.json;type=application/json" \
            -F "file=@$JAR;type=application/java-archive")
          if [ "$STATUS" != "200" ]; then
            cat response.json
            if [ "$STATUS" = "401" ]; then
              echo "::error::Modrinth refused the upload. Give the Modrinth token the 'Create versions' scope."
            else
              echo "::error::Modrinth upload failed (HTTP $STATUS)."
            fi
            exit 1
          fi
          jq '{id, version_number, version_type, game_versions}' response.json
          echo "Published $VERSION for Minecraft $MINECRAFT: https://modrinth.com/mod/$PROJECT/version/$VERSION"
