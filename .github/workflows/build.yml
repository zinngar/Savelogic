name: Build Fabric Mod

on:
  push:name: Build Fabric Mod

# Trigger on:
# - any push (so feature branches and dependabot branches will run)
# - pull requests (opened / synchronized / reopened)
# - manual runs (workflow_dispatch)
# - a daily scheduled run (optional)
on:
  push: {}
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC — adjust or remove as needed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: savelogic-build
          path: build/libs/*.jar
    branches: [ main ]
  pull_request:

