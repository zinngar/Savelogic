plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// "2.0.0+26.3": the mod's own version, plus (as semver build metadata) the Minecraft version it is built for.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // HTTP uses java.net.http and JSON uses the Gson that ships with Minecraft,
    // so nothing needs to be bundled into the jar.
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

loom {
    splitEnvironmentSourceSets()

    mods {
        savelogic {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Screenshot tests for the mod's menus: ./gradlew runClientGameTest (not part of the mod jar).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "savelogic-gametest"
        enableGameTests = false
        enableClientGameTests = true
    }
}
